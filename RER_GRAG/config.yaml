# Paper-aligned default configuration.
# Verify these settings against the exact checkpoint/run used for the final reported results.

graphrag:
  selected_entities: 5
  top_k_relationships: 5
  text_unit_prop: 0.8
  community_prop: 0.0
  max_context_tokens: 6000
  max_answer_tokens: 2000
  temperature: 0.0
  community_level: 0
  llm_model: gpt-4o-mini
  embedding_model: text-embedding-3-small

reranker:
  base_model: BAAI/bge-reranker-base
  oversampling_factor: 4
  max_length: 256
  pair_batch_size: 16
  soft_topk_temperature: 0.7
  fp16: true

training:
  learning_rate: 1.0e-6
  weight_decay: 0.01
  replay_buffer_size: 200
  replay_probability: 0.3
  replay_balance: 0.5
  gradient_clip: 1.0
  seed: 13

judge:
  model: gpt-5-mini
  prompt: RER_GRAG/QA_judge.md
